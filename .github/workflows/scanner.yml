name: Hourly MACD Market Scanner

on:
  schedule:
    # 改为每小时的第 23 分运行（避开 0 分拥堵高峰，响应更快）
    - cron: '23 8-23 * * 1-5'
    - cron: '23 0 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Run MACD Agent
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python agent.py

      - name: Commit and push state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agent_state.json || true
          git commit -m "Update trading state [skip ci]" || exit 0
          git push
